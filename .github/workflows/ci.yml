name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJM_BUILD_APPS=OFF

      - name: Build
        run: cmake --build build --config Release --target CgpaCoreTests

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  unit-coverage:
    name: Unit Test Coverage
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install coverage tooling
        run: python -m pip install gcovr

      - name: Configure coverage build
        run: >
          cmake -S . -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DJM_BUILD_APPS=OFF
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build unit tests
        run: cmake --build build-coverage --target CgpaCoreTests

      - name: Run unit tests
        run: ctest --test-dir build-coverage --output-on-failure

      - name: Enforce line coverage
        run: gcovr --root . --filter "src/cgpa" --exclude "tests" --txt --fail-under-line 90

  code-quality:
    name: Code Scanning / Quality
    runs-on: windows-latest
    needs:
      - unit-tests
      - unit-coverage

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL quality queries
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          queries: +security-and-quality

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets for analysis
        run: cmake --build build --config Release

      - name: Analyze quality findings
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp/quality"

  code-security:
    name: Code Scanning / Security
    runs-on: windows-latest
    needs:
      - unit-tests
      - unit-coverage

    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: Initialize CodeQL security queries
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          queries: +security-extended

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets for analysis
        run: cmake --build build --config Release

      - name: Analyze security findings
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp/security"
